version: "3"

vars:
  TAP_REPO: '{{.TAP_REPO | default (printf "%s/Developer/owner/PeachlifeAB/homebrew-tap" .HOME)}}'
  RELEASE: '"{{.TAP_REPO}}/bin/release" --product sive --project-root "{{.ROOT_DIR}}"'

tasks:
  default:
    cmd: task --list
    silent: true

  fmt:
    desc: Verify Python formatting.
    cmd: uv run ruff format --check .

  lint:
    desc: Run Ruff lint checks.
    cmd: uv run ruff check .

  tests:
    desc: Run the project test suite with the current project interpreter.
    cmd: uv run python -m pytest

  test:
    desc: Run every local quality gate.
    cmds:
      - task: fmt
      - task: lint
      - task: tests

  release:prepare:
    desc: "Prepare a Sive release. Usage: task release:prepare VERSION=X.Y.Z"
    requires:
      vars: [VERSION]
    cmd: '{{.RELEASE}} prepare "{{.VERSION}}"'

  release:verify:
    desc: "Verify prepared Sive release state. Usage: task release:verify VERSION=X.Y.Z"
    requires:
      vars: [VERSION]
    cmd: '{{.RELEASE}} verify "{{.VERSION}}"'

  release:publish:
    desc: "Publish prepared Sive state and Homebrew bottles. Usage: task release:publish VERSION=X.Y.Z"
    requires:
      vars: [VERSION]
    cmd: '{{.RELEASE}} publish "{{.VERSION}}"'

  release:resume:
    desc: "Resume a partially completed Sive release. Usage: task release:resume VERSION=X.Y.Z"
    requires:
      vars: [VERSION]
    cmd: '{{.RELEASE}} resume "{{.VERSION}}"'

  release:post-verify:
    desc: "Verify the published Homebrew upgrade. Usage: task release:post-verify VERSION=X.Y.Z"
    requires:
      vars: [VERSION]
    cmd: '{{.RELEASE}} post-verify "{{.VERSION}}"'

  release:dry-run:
    desc: "Preview the complete Sive release. Usage: task release:dry-run VERSION=X.Y.Z"
    requires:
      vars: [VERSION]
    cmd: '{{.RELEASE}} release "{{.VERSION}}" --dry-run'

  release:
    desc: "Run the complete deterministic Sive release. Usage: task release VERSION=X.Y.Z"
    requires:
      vars: [VERSION]
    cmd: '{{.RELEASE}} release "{{.VERSION}}"'

  release:preflight:
    desc: Study current upstream/tap state and gate the Homebrew handoff.
    cmd: '"{{.TAP_REPO}}/bin/preflight" sive'
